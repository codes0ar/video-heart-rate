plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号跟随 git：versionName = "2.0." + (提交数 - 3)，每次提交自动 +1（第 3 次提交 = 2.0.0）
def commitCount = {
    try {
        def p = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        p.waitFor()
        def t = p.text.trim()
        return t.isInteger() ? t.toInteger() : 3
    } catch (Exception ignored) {
        return 3
    }
}()

android {
    namespace 'com.example.videohr'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.videohr"
        minSdk 24
        targetSdk 35
        versionCode commitCount
        versionName "2.0.${commitCount - 3}"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'

    implementation 'com.google.mlkit:face-detection:16.1.7'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
